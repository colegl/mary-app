# Deploys Mary's kiosk to Cloudflare whenever main changes, or when run by hand
# (Actions → Deploy → Run workflow). It also does the one-time setup: it creates the
# D1 database and R2 bucket if they're missing, applies database migrations, generates
# the kiosk key, and copies Worker secrets from GitHub. See README "Deploy".
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: mary-kiosk
  D1_NAME: mary-kiosk
  R2_BUCKET: mary-kiosk-photos

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: |
          npm test
          npm run type-check

      - name: Check the Cloudflare secrets are set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings → Secrets and variables → Actions. See the README."
            exit 1
          fi

      - name: Create the D1 database if it's missing
        run: |
          id=$(npx wrangler d1 list --json | jq -r --arg n "$D1_NAME" '.[] | select(.name == $n) | .uuid')
          if [ -z "$id" ]; then
            echo "Creating D1 database $D1_NAME"
            npx wrangler d1 create "$D1_NAME" > /dev/null
            id=$(npx wrangler d1 list --json | jq -r --arg n "$D1_NAME" '.[] | select(.name == $n) | .uuid')
          fi
          if [ -z "$id" ]; then echo "::error::Couldn't find or create the D1 database"; exit 1; fi
          echo "D1 database id: $id"
          # Point this run's wrangler.jsonc at it (the committed file keeps a placeholder).
          sed -i "s/REPLACE-WITH-ID-FROM-wrangler-d1-create/$id/" wrangler.jsonc

      - name: Create the R2 bucket if it's missing
        run: |
          if npx wrangler r2 bucket list | grep -qE "(^|[[:space:]])${R2_BUCKET}([[:space:]]|$)"; then
            echo "R2 bucket $R2_BUCKET exists"
          else
            echo "Creating R2 bucket $R2_BUCKET"
            npx wrangler r2 bucket create "$R2_BUCKET"
          fi

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply "$D1_NAME" --remote

      - name: Work out the Worker's address
        id: url
        env:
          PUBLIC_URL_OVERRIDE: ${{ vars.PUBLIC_URL }}
        run: |
          if [ -n "$PUBLIC_URL_OVERRIDE" ]; then
            url="$PUBLIC_URL_OVERRIDE"
          else
            sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty')
            if [ -z "$sub" ]; then
              echo "::error::Your account has no workers.dev subdomain yet. Open Workers & Pages in the Cloudflare dashboard once to pick one, then run this again."
              exit 1
            fi
            url="https://$WORKER_NAME.$sub.workers.dev"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Worker address: $url"

      - name: Prepare secrets
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: |
          # Which secrets the Worker already has (names only). A missing Worker means a first
          # deploy; any other failure stops here, so the kiosk key is never regenerated by mistake.
          code=$(curl -sS -o "$RUNNER_TEMP/existing-raw.json" -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/secrets")
          if [ "$code" = "200" ]; then
            jq '.result' "$RUNNER_TEMP/existing-raw.json" > "$RUNNER_TEMP/existing.json"
          elif [ "$code" = "404" ]; then
            echo "[]" > "$RUNNER_TEMP/existing.json"
          else
            echo "::error::Couldn't read the Worker's secrets (HTTP $code). Check the API token's permissions."
            jq -c '.errors' "$RUNNER_TEMP/existing-raw.json" || true
            exit 1
          fi
          node scripts/ci-secrets.mjs "$RUNNER_TEMP/existing.json" "$RUNNER_TEMP/secrets.json"

      - name: Deploy
        env:
          PUBLIC_URL: ${{ steps.url.outputs.url }}
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
          CALENDAR_SOURCE: ${{ vars.CALENDAR_SOURCE }}
          CALENDAR_ID: ${{ vars.CALENDAR_ID }}
          ALERT_PROVIDER: ${{ vars.ALERT_PROVIDER }}
          TIMEZONE: ${{ vars.TIMEZONE }}
        run: |
          args=(--var "PUBLIC_URL:$PUBLIC_URL" --secrets-file "$RUNNER_TEMP/secrets.json")
          # Repository variables override wrangler.jsonc when they're set.
          for v in ACCESS_TEAM_DOMAIN ACCESS_AUD CALENDAR_SOURCE CALENDAR_ID ALERT_PROVIDER TIMEZONE; do
            if [ -n "${!v}" ]; then args+=(--var "$v:${!v}"); fi
          done
          npx wrangler deploy "${args[@]}"
          rm -f "$RUNNER_TEMP/secrets.json"

      - name: Summary
        env:
          PUBLIC_URL: ${{ steps.url.outputs.url }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "- Kiosk: $PUBLIC_URL"
            echo "- Admin: $PUBLIC_URL/admin/"
            echo "- Google sign-in redirect URI: $PUBLIC_URL/oauth/google/callback"
            if [ -z "$ACCESS_AUD" ]; then
              echo ""
              echo "**Next:** the admin page stays locked until Cloudflare Access is set up and the ACCESS_TEAM_DOMAIN and ACCESS_AUD variables are added (README step 4)."
            elif [ -z "$GOOGLE_CLIENT_ID" ]; then
              echo ""
              echo "**Next:** connect Google Calendar (README step 5)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
